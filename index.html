<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="你叫黄二勋，从十岁开始，经历读书、打工、恋爱和成家。十六站，走到2036年。每次由你来选。">
  <title>黄二勋的传奇人参</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./life-trends.css">
  <link rel="stylesheet" href="./section-emotion.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <header class="site-header">
      <div id="site-heading"><span class="site-name">再活一次</span></div>
      <button id="music-toggle" class="btn" type="button" aria-label="配乐" aria-pressed="true" title="UCSL 读博模拟器原配乐" disabled>♫ 配乐已开</button>
    </header>
    <p id="notice" class="notice" role="status" hidden></p>
    <main id="main" tabindex="-1">
      <div class="home">
        <div class="home-opening">
          <h1 class="page-title"><span class="title-phrase">黄二勋的</span><span class="title-phrase">传奇人参</span></h1>
          <p class="home-intro">1973 年，你叫黄二勋，十岁，刚和哥哥来到美国读书。父母还在曼谷。你想写封信回家，却不知道该不该说自己想家。</p>
        </div>
        <figure class="home-art">
          <div class="home-art-surface"><img src="./assets/jensen-guide.webp" width="768" height="768" alt="银发、眼镜和黑色皮夹克的黄二勋插画小人"></div>
        </figure>
        <div class="home-start" id="startup">
          <p id="startup-status" role="status">正在载入游戏……</p>
          <button id="startup-retry" class="btn" type="button" hidden>重新加载</button>
        </div>
      </div>
      <noscript><p class="loading">请启用 JavaScript 后重新打开本页。</p></noscript>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div id="modal-content"></div>
  </dialog>
  <div id="announcement" class="visually-hidden" role="status"></div>
  <script>
    (function () {
      var status = document.getElementById('startup-status');
      var retry = document.getElementById('startup-retry');
      function update(message) {
        if (!status.isConnected) return;
        status.textContent = message;
        retry.hidden = false;
      }
      var slow = setTimeout(function () {
        update('网络有点慢，游戏仍在载入。');
      }, 8000);
      function checkStartup(event) {
        if (!event.target || event.target.id !== 'game-script') return;
        clearTimeout(slow);
        update('游戏未能载入，请重新加载。');
      }
      document.addEventListener('error', checkStartup, true);
      document.addEventListener('load', checkStartup, true);
      retry.addEventListener('click', function () { location.reload(); });
    })();
  </script>
  <script type="module" id="game-script" src="./game-0115da118bc1.js"></script>
</body>
</html>
